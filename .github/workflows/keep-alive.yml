name: keep-alive

# Pings the service every few minutes so the free Render instance never sleeps
# (a sleeping instance takes ~40s to wake, which can drop the first WhatsApp message).
on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {}    # allows manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging TorBot..."
          curl -fsS --max-time 40 https://torbot-yxjg.onrender.com/api/health || echo "ping failed (will retry next cycle)"
