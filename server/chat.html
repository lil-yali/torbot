<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TorBot — צ'אט בדיקה</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b141a;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone {
      width: 100%;
      max-width: 460px;
      height: 100vh;
      max-height: 860px;
      display: flex;
      flex-direction: column;
      background: #0b141a;
      overflow: hidden;
    }
    .header {
      background: #202c33;
      color: #e9edef;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: #00a884; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px;
    }
    .header .info { flex: 1; }
    .header .name { font-size: 16px; font-weight: 600; }
    .header .sub { font-size: 12px; color: #8696a0; }
    .controls {
      background: #182229;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #0b141a;
    }
    .controls label { color: #8696a0; font-size: 12px; }
    select {
      background: #2a3942; color: #e9edef; border: none;
      border-radius: 6px; padding: 6px 8px; font-size: 13px; flex: 1;
    }
    .reset-btn {
      background: #2a3942; color: #e9edef; border: none;
      border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
    }
    .reset-btn:hover { background: #3b4a54; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background-color: #0b141a;
      background-image: linear-gradient(rgba(11,20,26,.95), rgba(11,20,26,.95));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bubble {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #e9edef;
    }
    .from-me { align-self: flex-start; background: #005c4b; border-top-right-radius: 2px; }
    .from-bot { align-self: flex-end; background: #202c33; border-top-left-radius: 2px; }
    .bubble .time { display: block; font-size: 10px; color: #8696a0; margin-top: 3px; text-align: left; }
    .typing { align-self: flex-end; color: #8696a0; font-size: 13px; padding: 4px 12px; }
    .composer {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: #202c33;
    }
    .composer input {
      flex: 1;
      background: #2a3942;
      border: none;
      border-radius: 20px;
      padding: 11px 16px;
      color: #e9edef;
      font-size: 15px;
      outline: none;
    }
    .composer button {
      width: 46px; height: 46px; border-radius: 50%;
      border: none; background: #00a884; color: #fff;
      font-size: 20px; cursor: pointer; flex-shrink: 0;
    }
    .composer button:disabled { opacity: .5; cursor: default; }
    .hint { text-align: center; color: #667781; font-size: 11px; padding: 4px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="avatar">TB</div>
      <div class="info">
        <div class="name">TorBot — מזכיר וירטואלי</div>
        <div class="sub" id="subLine">מקליד…</div>
      </div>
    </div>

    <div class="controls">
      <label>אתה:</label>
      <select id="role">
        <option value="customer">לקוח (קובע תור)</option>
        <option value="owner">בעל העסק (רואה תורים / חוסם תאריכים)</option>
      </select>
      <button class="reset-btn" id="resetBtn">אפס שיחה</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="hint" id="hint"></div>

    <div class="composer">
      <input id="input" placeholder="הקלד הודעה…" autocomplete="off" />
      <button id="send">➤</button>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    // The business the customer is messaging (Test Barber, created during setup).
    const BUSINESS = '+972504732111';
    const CUSTOMER = '+972541234567';

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const roleEl = document.getElementById('role');
    const subLine = document.getElementById('subLine');
    const hintEl = document.getElementById('hint');

    function currentFromTo() {
      // customer: from=customer -> to=business.  owner: from=business -> to=business.
      return roleEl.value === 'owner'
        ? { from: BUSINESS, to: BUSINESS }
        : { from: CUSTOMER, to: BUSINESS };
    }

    function updateHint() {
      hintEl.textContent = roleEl.value === 'owner'
        ? 'נסה: "מה התורים שלי היום?" · "תחסום את התאריך 5 באוגוסט"'
        : 'נסה: "אני רוצה תור למחר בשעה 10" · "קוראים לי דני"';
      subLine.textContent = roleEl.value === 'owner'
        ? 'משוחח כבעל העסק (' + BUSINESS + ')'
        : 'משוחח כלקוח (' + CUSTOMER + ')';
    }

    function now() {
      return new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    }

    function addBubble(text, who) {
      const div = document.createElement('div');
      div.className = 'bubble ' + (who === 'me' ? 'from-me' : 'from-bot');
      div.innerHTML = text.replace(/</g, '&lt;') + '<span class="time">' + now() + '</span>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    let typingEl = null;
    function showTyping() {
      typingEl = document.createElement('div');
      typingEl.className = 'typing';
      typingEl.textContent = 'TorBot מקליד…';
      messagesEl.appendChild(typingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

    async function send() {
      const body = inputEl.value.trim();
      if (!body) return;
      inputEl.value = '';
      addBubble(body, 'me');
      sendBtn.disabled = true;
      showTyping();
      try {
        const { from, to } = currentFromTo();
        const res = await fetch(API + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from, to, body })
        });
        const data = await res.json();
        hideTyping();
        addBubble(data.reply || data.error || '(אין תשובה)', 'bot');
      } catch (e) {
        hideTyping();
        addBubble('שגיאת רשת: ' + e.message, 'bot');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    async function resetChat() {
      const { from, to } = currentFromTo();
      await fetch(API + '/api/chat/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from, to })
      });
      messagesEl.innerHTML = '';
      addBubble('שלום! אני TorBot 🤖 איך אפשר לעזור?', 'bot');
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    roleEl.addEventListener('change', () => { updateHint(); resetChat(); });
    document.getElementById('resetBtn').addEventListener('click', resetChat);

    updateHint();
    addBubble('שלום! אני TorBot 🤖 איך אפשר לעזור?', 'bot');
    inputEl.focus();
  </script>
</body>
</html>
